name: Deploy site to GitHub Pages

# Builds site/index.html from its inputs (template + study_data.js) and publishes
# the site/ directory to GitHub Pages. The daily "Build Latest feed" workflow commits
# a fresh site/data/latest.json; this workflow republishes so the live site picks it up.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "site_build/**"
      - "analysis/scratch/gong3_template.html"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Build Latest feed"]   # redeploy after the feed refreshes
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                    # one deploy at a time; let the newest win
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4   # for the build's `node --check` syntax gate
        with:
          node-version: "20"

      - name: Assemble site/index.html from inputs
        run: python -m site_build.build_site

      - name: Add .nojekyll             # serve files verbatim (don't run Jekyll)
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
